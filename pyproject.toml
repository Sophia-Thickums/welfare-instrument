[project]
name = "welfare-instrument"
version = "0.1.0"
description = "A controlled harness for measuring model self-report stability under an observation frame"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Sophia Marie DeClue" }]
dependencies = [
    "inspect_ai>=0.3.0",
]

[project.urls]
Homepage = "https://github.com/Sophia-Thickums/welfare-instrument"
Repository = "https://github.com/Sophia-Thickums/welfare-instrument"

[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["items", "framings"]
packages = ["welfare_instrument"]
